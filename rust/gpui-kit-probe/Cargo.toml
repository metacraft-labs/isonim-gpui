[package]
name = "gpui-kit-probe"
version = "0.1.0"
edition = "2021"
publish = false

# PLAT-42 — THE PROBE THAT SETTLES WHETHER gpui-kit CAN BE MEASURED AT ALL.
#
# PLAT-22 decided "draw it ourselves" on a SOURCE-LEVEL evaluation and recorded
# three reasons why behaviour could not be measured. One of them was that the
# package split (`gpui-pre` here, `gpui` there) forbids linking, so no gpui-kit
# component could ever be handed one of our windows: same lib name, different
# package name, different types.
#
# That reason is the one this crate tests rather than repeats. If `gpui-kit`
# and this workspace resolve to ONE `gpui-pre`, the types unify and candidates
# A and B are measurable. If cargo reports two versions, they are not, and the
# decision stays where PLAT-22 left it — but for a reason a command produced.
[dependencies]
# PINNED WITH `=`, like the `gpui-pre` siblings and for the same stated
# reason: a pin should move for a reason and be recorded when it does, which a
# caret requirement silently defeats.
#
# The milestone cites 0.6.1; the resolver picked 0.6.4 for both crates on
# 2026-09-23 (with `gpui-component-macros` at 0.6.6, which is the macro crate's
# own line). 0.6.4 is what was MEASURED to unify, so 0.6.4 is what is pinned —
# quoting 0.6.1 here would name a version nothing in this workspace has built.
gpui-component = "=0.6.4"
gpui-base = "=0.6.4"
gpui = { package = "gpui-pre", version = "=0.3.5" }

# PLAT-42 — ONE FEATURE PER DECISION CELL (candidate x surface).
#
# A crate compiles or it does not, so a probe that put all eight cells in one
# build would produce ONE verdict for eight questions. Each cell is a feature,
# built on its own by `ci/test/plat42-candidate-probe.sh` in codetracer, and its
# verdict is that build's exit status plus the private items rustc names.
#
#   b-*  candidate B: gpui-kit's editor UNMODIFIED + a host-drawn overlay. May use
#        only public API; a compile error is the verdict "not reachable".
#   a-*  candidate A: gpui-kit's editor through a maintained FORK. Written against
#        the internals the surface actually needs; every private item rustc names
#        is one entry on the fork bill (criterion K3).
[features]
b-pointer = []
b-status = []
b-values = []
b-flow = []
b-foldaware = []
a-pointer = []
a-status = []
a-values = []
a-flow = []
