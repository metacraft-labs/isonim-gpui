[workspace]
members = ["gpui-nim-shim", "gpui-kit-probe"]
resolver = "2"

# gpui-pre-linux 0.3.5 with three changes. First, a press's click count is decided by
# the press events' own times (X11 `ButtonPress.time`, Wayland
# `wl_pointer.button` time) rather than by when the window handled them, so a
# window busy between two presses of a double click still sees one
# (`vendor/gpui-pre-linux/src/linux/platform.rs`, `is_next_click`). Drop this
# when upstream counts clicks the same way.
#
# And a second: a Wayland keyboard announced with NO keymap (`no_keymap`) no
# longer aborts the window. Upstream ignores such a keymap and then unwraps the
# keymap it does not have on the next `modifiers` or `key` event
# (`vendor/gpui-pre-linux/src/linux/wayland/client.rs`); here the keyboard's
# modifiers and keys are ignored until a keymap arrives
# (`tests/test_gui_keyboard_no_keymap.nim`).
#
# And a third: the time of the key event being dispatched (X11 `KeyPress.time`,
# Wayland `wl_keyboard.key` time) is kept for the window's key handler to read
# (`vendor/gpui-pre-linux/src/linux/platform.rs`, `key_event_time_ms`), because
# GPUI's KeyDownEvent carries none and a window busy between quick keys handles
# them seconds apart. The shim passes it to its consumer with each key.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
