[package]
name = "gpui-nim-shim"
version = "0.1.0"
edition = "2021"
description = "C FFI shim exposing GPUI operations for IsoNim's RendererBackend"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable actual GPUI rendering (requires GPU system deps).
# Without this feature, the shim provides the shadow tree and extern "C" API
# but the launch function does not start a real GPUI window.
#
# The feature names below are `gpui_platform/*`, which is the DEPENDENCY KEY
# in `[dependencies]`, not the package name. Since the gpui-kit alignment the
# key is a rename of `gpui-pre-platform`; the spellings here are unchanged
# because cargo namespaces features by key.
gpui-backend = [
    "gpui",
    "gpui_platform",
    "gpui_platform/runtime_shaders",
    "gpui_platform/x11",
    "gpui_platform/wayland",
]
# RS-M14 Phase 2: enable the headless RGBA rendering path via Zed's
# `HeadlessAppContext::with_platform` + `Window::render_to_image`. Coexists
# with `gpui-backend`; the windowed launch path in `gpui_app.rs` is untouched.
# Pulls in `gpui` (with `test-support` so `HeadlessAppContext` and
# `Window::render_to_image` are visible), `gpui_platform` for the
# `current_platform` / `current_headless_renderer` helpers, and `image` for
# converting the captured `RgbaImage` into raw bytes.
#
# `runtime_shaders` skips the build-time `metal` shader compiler invocation
# (the dev shell here doesn't ship the macOS Metal Toolchain; gpui_macos's
# default build path needs `xcodebuild -downloadComponent MetalToolchain`).
# With `runtime_shaders`, the shaders are compiled at run time when the
# Metal renderer first instantiates — which is fine for our headless
# rendering use case.
gpui-headless = [
    "gpui/test-support",
    "gpui",
    "gpui_platform/test-support",
    "gpui_platform/font-kit",
    "gpui_platform/runtime_shaders",
    "gpui_platform",
    "image",
]

[dependencies]
# THE GPUI PIN. See `docs/gpui-pin.md`; `tools/check_gpui_pin.sh` is the gate
# that keeps the three copies of the version below in agreement.
#
# `gpui-pre` is a crates.io republication of Zed's own `gpui` crate — 0.3.5 is
# a snapshot of `zed-industries/zed@d89e9c2` (2026-09-14), and each sibling
# carries the source revision in `[package.metadata.gpui-pre]`. The `package =`
# renames matter and are not cosmetic:
#
#   * `gpui-pre`'s `[lib] name` is already `gpui` and `gpui-pre-platform`'s is
#     already `gpui_platform`, so every `use gpui::…` / `use gpui_platform::…`
#     in `src/` is unchanged by the switch. Nothing in this crate's Rust source
#     names the package.
#   * It is the package NAME, not the lib name, that decides type identity
#     across a binary. `gpui-kit` (`gpui-component`, `gpui-base`) depends on
#     `gpui-pre`; while we depended on `gpui` from the zed git remote, its
#     `Entity<T>`/`App`/`Window` and ours were different types and no gpui-kit
#     component could be handed one of our windows. Same package name is what
#     makes that graph unify.
#
# `=0.3.5` rather than `0.3.5`: the pin should move for a reason and be
# recorded when it does, which a caret requirement silently defeats. The
# `gpui-pre-*` siblings already inter-depend with `=` for the same reason.
#
# Moving this version requires verifying that:
#   1. `cargo build --features gpui-backend` (the windowed launch path) still
#      builds.
#   2. `cargo build --features gpui-headless` builds and the headless test in
#      `tests/test_headless_render.rs` still passes.
#   3. `just test-gui` still captures and asserts the scene's pixels.
gpui = { package = "gpui-pre", version = "=0.3.5", optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
serial_test = "3"
serde_json = "1"
gpui = { package = "gpui-pre", version = "=0.3.5", features = ["test-support"] }
