name: CI

# This workflow was rewritten, because what was here could never have run.
#
# The `nim-tests` job checked isonim out with
#
#     - uses: actions/checkout@v4
#       with: { repository: metacraft-labs/isonim, path: ../isonim }
#
# and `actions/checkout` REFUSES a path outside `$GITHUB_WORKSPACE`, so the
# job died on its second step every time. Two further reasons it could not
# have been green even past that:
#
#   * `tools/check_bindings.sh` was red at HEAD — it scanned `src/lib.rs`
#     only, while six exports live in `src/gpui_headless.rs`, so it reported
#     them as "EXTRA in Nim bindings".
#   * three of the Nim suites did not compile at all, because isonim's own
#     `isonim/core/platform` imports `nim_everywhere/platform` and nothing
#     put `../nim-everywhere/src` on the path.
#
# So the tests existed and "ran manually", which is the shape a lane has
# when nobody has seen it green.
#
# Siblings are now cloned by `setup-dev-env`, which resolves each name in
# `.github/sibling-repos` (isonim, nim-everywhere) against the per-commit
# workspace lock in the manifest repo. That is the single approved sibling
# revision source; a second hand-pinned `actions/checkout` is another place
# for revisions to drift away from what the workspace actually builds.
#
# And the suite is now ONE step (`ci/run-suite.sh`) rather than fifteen,
# because fifteen steps report fifteen verdicts and no case count, and a
# suite that stops running does not fail — it ceases to exist. The lane
# totals its cases, prints a per-subject table, and goes red when the total
# moves.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  suite:
    name: Suite (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      # The manifest repo holding the workspace locks (metacraft-manifests)
      # is private, so `secrets.GITHUB_TOKEN` cannot read it. Mint an
      # installation token from the org's CI Token Provider app instead. The
      # app id is an ORG VARIABLE and only the private key is a secret —
      # `secrets.CI_TOKEN_PROVIDER_APP_ID` does not exist and expands to the
      # empty string.
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      # The lane's own tally is the report. It prints a per-subject table
      # with an rc and a case count for every subject, asserts the total
      # against the number recorded in the script, and NAMES the subset it
      # did not run.
      - name: Test suite (core)
        run: dev-exec ci/run-suite.sh

  suite-gpui:
    # The half of the lane that compiles GPUI itself: `cargo test
    # --features gpui-backend` (the 18 `TestAppContext` integration cases)
    # and `--features gpui-headless` (the 7 async-render and 4 pixel-capture
    # cases). Separated from `suite` because it pulls several hundred crates
    # of Zed, not because it is optional — `suite` prints the fact that it
    # skipped these, so a green `suite` cannot be read as a full run.
    #
    # THIS JOB GATES, AND THAT IS A DECISION RATHER THAN A DEFAULT.
    # The first draft of this workflow promoted it to gating silently,
    # while `--features gpui-headless` carried a known ~1-in-25 flake:
    # `stale_token_after_bump_returns_stale_sentinel` re-polled a
    # stale-consumed token and read `2` instead of `-100` whenever the
    # worker's publish landed between the two polls. Measured before the
    # repair at **4 failures in 200 runs** under 8-way load; and when it
    # fired, `cargo` abandoned the remaining targets, so the 4
    # pixel-capture cases did not run at all and the arm reported 138
    # cases instead of 149.
    #
    # Gating a job with a live flake is not a decision to find out, it is
    # a decision made without knowing. So the flake was fixed rather than
    # tolerated — it was a product defect (a stale take removed a
    # `Pending` slot the worker still owed a publish, orphaning the
    # result and, on the success path, retaining `w * h * 4` bytes for
    # the process lifetime) and it is now graded by arm H1 of
    # `tools/run-plat19-mutations.py`. Re-measured after the repair:
    # **0 failures in 1,000 runs** under the identical load.
    #
    # If this job does start flaking, the answer is the same one the
    # repair took: find the race. `continue-on-error` here would hide a
    # product defect behind a green tick, which is the state `vm-js` was
    # in when this campaign found it.
    name: Suite incl. GPUI (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64, eph-macos-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: Test suite (core + GPUI-linking builds)
        run: dev-exec ci/run-suite.sh --with-gpui

  gui-tests:
    # RS-M14b: the windowed path under a headless display server. This is
    # the one job that needs a compositor, and it is the one that has never
    # been observed here, so it is NOT yet folded into the lane and NOT
    # given `continue-on-error`. It gates like everything else; if it turns
    # out to be unrunnable on the fleet, that is a finding to record rather
    # than a flag to set.
    name: GUI tests (headless display) (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-linux-x64, eph-linux-arm64]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - uses: actions/checkout@v4

      - name: Setup dev env (clones .github/sibling-repos at lock revisions)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}

      - name: Build shim with gpui-backend
        run: dev-exec bash -c "cd rust && cargo build --features gpui-backend"

      - name: Run GUI tests under Xvfb
        run: dev-exec just test-gui-x11 --record

      - name: Upload test recordings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-recordings-${{ matrix.runner }}
          path: target/test-recordings/
          retention-days: 7
