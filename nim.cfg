--path:"src"
--path:"../isonim/src"

# PLAT-19: isonim's own `isonim/core/platform` imports `nim_everywhere/platform`,
# so without this path THREE of the suites do not compile at all —
# test_cross_renderer, test_render_integration and test_structural_comparison
# all failed with
#     isonim/src/isonim/core/platform.nim(4, 22) Error: cannot open file:
#     nim_everywhere/platform
# which is why the Justfile recipes that ran them needed a `--path` on the
# command line and CI (which passes only `--path:../isonim/src`) could not
# have run them at all. Declared here so every entry point gets it.
--path:"../nim-everywhere/src"
