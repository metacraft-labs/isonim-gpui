# Sway headless configuration for CI/headless GUI testing
output HEADLESS-1 {
    mode 1920x1080@60Hz
    pos 0 0
    bg #000000 solid_color
}

default_border none
titlebar_border_thickness 0
titlebar_padding 0

bar {
    mode invisible
}

focus_follows_mouse no

input "*" {
    repeat_delay 200
    repeat_rate 50
}

popup_during_fullscreen leave_fullscreen

# No Xwayland. Nothing a test runs under this compositor is an X11 client
# (wayland-run-test.sh unsets DISPLAY for its children), and an Xwayland
# takes an X display number on the host: another job's X11 client started
# with a DISPLAY that names it then maps INTO this compositor, which tiles it
# beside the window under test and halves that window. Measured 2026-11-23
# (codetracer-pm 2026-11-23-a-foreign-x11-client-maps-into-the-headless-sway-
# of-a-gpui-capture-through-its-xwayland.md): another job's Electron mapped
# into a plat47 capture's sway 3 times in one run; 3 of 5 runs failed on it.
xwayland disable
